# Copy this file to ~/.config/weave/config.toml and edit it.
# Every value shown here is the built in default, so an empty config is valid.

[youtube]
# Where yt-dlp reads cookies from. Either a path to a Firefox family profile
# directory, or "auto", which prefers a profile that is signed in over one
# that is not. Settings and the setup wizard offer the profiles found on this
# machine, and a choice made there wins over this line, so this is only worth
# writing for a profile in a place nothing looks, such as another drive.
# Chromium family browsers work through yt-dlp but are untested here, because
# they need the desktop keyring to derive a decryption key.
browser_profile = "auto"

# Which YouTube identity to speak as. A Google account can carry more than one,
# and the cookies alone do not say which is in use. Auto follows whichever the
# browser is using, which is whichever was last used there and is almost always
# the right one. If your music library looks like somebody else's, run
# `weave music identity` and put the number here.
music_identity = "auto"

[player]
# "auto" prefers mpv-ff2mpv-single.sh when it is on PATH, because that wrapper
# already handles URL canonicalization, Twitch resolving and single instance
# reuse. It falls back to plain mpv.
command = "auto"
# mpv JSON IPC socket. "auto" resolves to $XDG_RUNTIME_DIR/mpv-ff2mpv.sock,
# which is the socket the wrapper creates.
ipc_socket = "auto"

[poll]
# A small round, often, rather than a large round rarely. The feed endpoint
# objects to a burst, not to a day's worth of requests, so the same volume
# spread evenly is both safer and quicker to come round.
tick_interval_s = 60
channels_per_tick = 15
# How often a channel is asked, decided by how recently it published. The
# shortest is a quarter of an hour because the feed itself answers with
# Cache-Control max-age=900, so asking sooner returns the same cached body.
# Most of a large subscription list has not posted in months, and asking those
# as often as the rest is what makes a full lap take hours.
feed_interval_s = 900
warm_interval_s = 3600
cold_interval_s = 21600
frozen_interval_s = 86400
active_days = 7
warm_days = 30
cold_days = 90
live_interval_s = 90
# One global throttle sits in front of every outbound request, so no feature
# can burst even by accident.
max_concurrency = 4
min_request_interval_ms = 220
# The subscriptions sweep is one paginated call covering every subscription.
# It fills in durations and live flags, and it names the channels that have
# something new, which is what lets the per channel feeds be asked only when
# there is a reason to.
sweep_limit = 1000
sweep_interval_s = 900
# A channel the sweep has named lately is asked on its own only every six hours,
# to refresh views and likes. Anything new from it arrives through the sweep,
# which asks that channel's feed the same minute. Should the sweep stop
# answering for half an hour, every channel is back on its own interval.
sweep_refresh_s = 21600
sweep_coverage_days = 30
sweep_stale_s = 1800
# Ask a channel's live feed as well as its videos feed. Streams live in their
# own tab, so without this one only appears once it has ended. Only channels
# seen streaming are asked.
poll_live_feeds = true
# Fill in the lengths RSS cannot carry, a channel at a time, off that channel's
# own tab listings. RSS carries no duration at all and the subscriptions sweep
# reaches only the newest thousand videos, so without this the lengths stop
# partway down a feed that has been running a while. One channel a tick is one
# or two requests a minute and answers that channel whole, so a long backlog
# closes over hours rather than in a burst.
fill_lengths = true
length_channels_per_tick = 1
length_recheck_s = 604800

# Ceilings on how much each endpoint may be asked inside one window, counted in
# the database so a restart cannot forget them. They sit well above what idle
# use spends, so they bite on a restart loop or a held down refresh button
# rather than on ordinary polling. Zero means no ceiling and no counting.
# See what has been spent with: weave budget
[budget]
window_s = 900
feeds = 300
browse = 40
player = 60
dislikes = 60
twitch = 120

[watched]
# Fraction of the duration that counts as watched. Reaching the end always
# counts, whatever this is set to.
threshold = 0.85

[twitch]
# The application Weave itself registered, so there is nothing to set up before
# pressing Connect. A client id is public by design, it ships inside every
# browser extension that talks to Twitch, and the device login used here has no
# client secret anywhere in it.
#
# Replace it to have the authorisation sit under an application of your own.
# Register one at dev.twitch.tv, set its client type to public, and paste the
# client id here. The redirect URL the console insists on is never used. An
# empty value turns the Twitch side off.
client_id = "1vkr3gus4nnxmpcodpbqv9urjkpc4b"

[cache]
# Thumbnails, avatars and banners live on disk this long. The server asks for
# five minutes, which would mean going back to the network on nearly every
# visit, so the stored copy is kept for this instead.
image_days = 7
# Ceiling for the image cache. A thumbnail averages about 17 KB.
image_max_mb = 300

[ui]
# How far one wheel notch moves the grid, counted in card rows. A Flickable on
# its own moves about sixty pixels, which is a fifth of a row here.
scroll_rows_per_notch = 0.5
