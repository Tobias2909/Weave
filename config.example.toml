# Copy this file to ~/.config/weave/config.toml and edit it.
# Every value shown here is the built in default, so an empty config is valid.

[youtube]
# Where yt-dlp reads cookies from. Either a path to a Firefox family profile
# directory, or "auto" to let yt-dlp discover a browser by itself.
# Chromium family browsers work through yt-dlp but are untested here, because
# they need the desktop keyring to derive a decryption key.
browser_profile = "auto"

# Which YouTube identity to speak as. A Google account can carry more than one,
# and the cookies alone do not say which is in use. Auto follows whichever the
# browser is using, which is whichever was last used there and is almost always
# the right one. If your music library looks like somebody else's, run
# `weave music identity` and put the number here.
music_identity = "auto"

[player]
# "auto" prefers mpv-ff2mpv-single.sh when it is on PATH, because that wrapper
# already handles URL canonicalization, Twitch resolving and single instance
# reuse. It falls back to plain mpv.
command = "auto"
# mpv JSON IPC socket. "auto" resolves to $XDG_RUNTIME_DIR/mpv-ff2mpv.sock,
# which is the socket the wrapper creates.
ipc_socket = "auto"

[poll]
feed_interval_s = 900
live_interval_s = 90
# One global throttle sits in front of every outbound request, so no feature
# can burst even by accident.
max_concurrency = 4
min_request_interval_ms = 250

[watched]
# Fraction of the duration that counts as watched. Reaching the end always
# counts, whatever this is set to.
threshold = 0.85

[twitch]
# From a Twitch application you register once at dev.twitch.tv. A client id is
# public by design, it ships inside every browser extension that talks to
# Twitch, but it identifies your developer account, so this file is not
# committed. Set the application's client type to public. The redirect URL the
# console asks for is not used by the login Weave performs.
client_id = ""

[cache]
# Thumbnails, avatars and banners live on disk this long. The server asks for
# five minutes, which would mean going back to the network on nearly every
# visit, so the stored copy is kept for this instead.
image_days = 7
# Ceiling for the image cache. A thumbnail averages about 17 KB.
image_max_mb = 300

[ui]
# How far one wheel notch moves the grid, counted in card rows. A Flickable on
# its own moves about sixty pixels, which is a fifth of a row here.
scroll_rows_per_notch = 0.5
